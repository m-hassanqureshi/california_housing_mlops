[project]
name = "california-housing-mlops"
version = "0.1.0"
description = "Reproducible MLOps pipeline for California Housing price prediction with Git, DVC, uv and GitHub Actions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
    "nbstripout>=0.9.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
# Leftover cookiecutter scaffold, kept until the team decides to delete it
extend-exclude = [
    "docs",
    "setup.py",
    "test_environment.py",
    "src/data",
    "src/features",
    "src/models",
    "src/visualization",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
