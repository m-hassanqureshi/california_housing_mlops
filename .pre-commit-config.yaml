# Local guard rails. Install once with: uv run pre-commit install
# Leftover cookiecutter files (Sphinx docs, setup.py, tox.ini, ...) are excluded
# until the team decides to delete them.
exclude: ^(docs/|setup\.py$|test_environment\.py$|tox\.ini$|src/(data|features|models|visualization)/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"] # data and models belong in DVC
      - id: detect-private-key
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"] # dvc.yaml uses custom tags in some setups
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # Use the tool versions pinned in uv.lock so the hooks and CI always agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: jupytext-sync
        name: jupytext sync (ipynb <-> py:percent)
        entry: uv run jupytext --sync
        language: system
        files: ^notebooks/.*\.(ipynb|py)$
